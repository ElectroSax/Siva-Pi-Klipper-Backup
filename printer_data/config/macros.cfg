[gcode_macro INPUT_SHAPING]
description: Run Resonance Measuring and calibration on the X axis
gcode:
    G28
    SHAPER_CALIBRATE AXIS=X

[gcode_macro START_PRINT]
gcode:
  ; Get first-layer bed-temp from slicer
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  ; Get first-layer extruder-temp from slicer
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
  G90 ; use absolute coordinates
  M83 ; extruder relative mode
  M104 S170 ; set extruder temp for bed leveling
  M140 S{BED_TEMP} ; set bed temp
  M109 S170 ; wait for bed leveling temp
  M190 S{BED_TEMP} ; wait for bed temp
  G28 ; home all axis
  ; mesh bed
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE
  M104 S{EXTRUDER_TEMP}; set extruder temp
  G90
  G1 X2 Y10 Z50 F3000
  M109 S{EXTRUDER_TEMP} ; wait for extruder temp
  LINE_PURGE ; purge nozzle

[gcode_macro PRINT_STOP]
gcode:
  G91 ;Relative positioning
  G1 E-2 F2700 ;Retract a bit
  G1 E-2 Z0.2 F2400 ;Retract and raise Z
  G1 Z5 ;Raise Z more
  G90 ;Absolute positionning
  G1 X0 Y200 F6000 ;Present print
  M106 S0 ;Turn-off fan
  M104 S0 ;Turn-off hotend
  M140 S0 ;Turn-off bed
  M84 X Y E ;Disable all steppers but Z
