[gcode_macro INPUT_SHAPING]
description: Run Resonance Measuring and calibration on the X axis
gcode:
    G28
    SHAPER_CALIBRATE AXIS=X

[gcode_macro START_PRINT]
description: Start-up Sequence for Print
gcode:
  G92 E0 ; Reset Extruder
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
  M140 S{BED_TEMP} ;Start heating bed
  G28 ; Home all axes
  G90
  G1 X0 Y200 ;Present print
  M190 S{BED_TEMP} ;Wait for bed to reach temp before proceeding
  M104 S{EXTRUDER_TEMP} ;Start heating extruder
  BED_MESH_CALIBRATE ; Auto bed leveling
  G1 Z10.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
  G1 X0.1 Y0 F5000.0 ; Move to start position
  G1 Z0.3 F3000
  M109 S{EXTRUDER_TEMP} ;Wait for extruder to reach temp before proceeding
  G1 X0.1 Y200.0 Z0.3 F1500.0 E30 ; Draw the first line
  G1 X0.4 Y200.0 Z0.3 F5000.0 ; Move to side a little
  G1 X0.4 Y20 Z0.3 F1500.0 E60 ; Draw the second line
  G92 E0 ; Reset Extruder
  G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
  G1 X5 Y20 Z0.3 F5000.0 ; Move over to prevent blob squish

[gcode_macro PRINT_STOP]
gcode:
  G91 ;Relative positioning
  G1 E-2 F2700 ;Retract a bit
  G1 E-2 Z0.2 F2400 ;Retract and raise Z
  G1 X5 Y5 F3000 ;Wipe out
  G1 Z50 ;Raise Z more
  G28 X Y
  G90 ;Absolute positionning
  G1 X0 Y200 ;Present print
  G91
  M106 S0 ;Turn-off fan
  M104 S0 ;Turn-off hotend
  M140 S0 ;Turn-off bed
  M84 X Y E ;Disable all steppers but Z
